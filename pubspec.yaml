name: mishra_milk_cash
description: "Mishra Milk Cash - Premium Cash Management Application"
publish_to: 'none'
version: 1.2.3+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # State Management
  provider: ^6.1.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # Sharing & Export
  share_plus: ^11.0.0
  pdf: ^3.12.0
  printing: ^5.14.2
  screenshot: ^3.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  
  # Update System
  dio: ^5.4.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.1
  disk_space_2: ^1.0.4
  connectivity_plus: ^6.0.3
  crypto: ^3.0.3
  open_filex: ^4.4.0
  flutter_local_notifications: ^17.1.2

  # Icons
  cupertino_icons: ^1.0.8
  flutter_slidable: ^4.0.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/mishra_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/mishra_logo.jpg"
